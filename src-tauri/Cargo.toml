[package]
name = "jerrivell-pdf"
version = "0.12.0"
description = "A local, open-source PDF workspace for Windows"
authors = ["Jerry and contributors"]
edition = "2021"
license = "MIT OR Apache-2.0"
default-run = "jerrivell-pdf"

[lib]
name = "jerrivell_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
tempfile = "3"
same-file = "1"
lopdf = { version = "=0.46.0", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
# Already shipped through Tauri; direct access is used for the comparison
# window's request guard and the dedicated worker's memory/job limits.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Com"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
